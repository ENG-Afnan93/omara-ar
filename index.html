  root.add(new T.Mesh(new T.SphereGeometry(0.36, 48, 32), new T.MeshStandardMaterial({ map:tex, roughness:.45 })));

// Animated USDZ (usda inside) for iPhone Quick Look — electrons spin around the nucleus
function atomUSDZ(sh, png){
  const f = x => (Math.round(x * 10000) / 10000).toString();

    for (let i = 0; i <= rings; i++){ const th = Math.PI * i / rings; for (let j = 0; j < seg; j++){ const ph = 2 * Math.PI * j / seg; P.push([cx + r * Math.sin(th) * Math.cos(ph), cy + r * Math.cos(th), cz + r * Math.sin(th) * Math.sin(ph)]); } }
    for (let i = 0; i < rings; i++) for (let j = 0; j < seg; j++){ const a = i * seg + j, b = i * seg + (j + 1) % seg, c = (i + 1) * seg + (j + 1) % seg, d = (i + 1) * seg + j; I.push(a, b, c, d); C.push(4); }

    for (let i = 0; i < seg; i++){ const u = 2 * Math.PI * i / seg; for (let j = 0; j < tube; j++){ const v = 2 * Math.PI * j / tube; P.push([(R + r * Math.cos(v)) * Math.cos(u), r * Math.sin(v), (R + r * Math.cos(v)) * Math.sin(u)]); } }

    return { P, I, C }; };

    for (let i = 0; i < rings; i++) for (let j = 0; j < seg; j++){ const a = i * (seg + 1) + j, b = a + 1, c = a + seg + 2, d = a + seg + 1; I.push(a, d, c, b); C.push(4); }

// minimal ZIP (stored, each file's data aligned to 64 bytes as USDZ requires)
function zipStore(files){

}
(async () => {

  mv.addEventListener('load', async () => {
    note.textContent = (await mv.canActivateAR) ? 'وجّهي الكاميرا على طاولة أو أرضية بعد ما تضغطين 📱' : 'هالجهاز أو المتصفح ما يدعم الواقع المعزز. افتحي الرابط من تلفون: آيفون (Safari) أو أندرويد (Chrome). وتقدرين تدوّرين الذرّة بإصبعج.';
  });
  mv.addEventListener('ar-status', ev => { if (ev.detail.status === 'failed') note.textContent = 'ما اشتغل الواقع المعزز. جربي مكان فيه إضاءة زينة وسطح واضح.'; });
})();
</script></body></html>
